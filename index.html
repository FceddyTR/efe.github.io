<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini 3D Arena Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 20%, #0f172a, #020617 40%);
      color: #e2e8f0;
      overflow: hidden;
    }

    #hud {
      position: fixed;
      top: 1rem;
      left: 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      width: 320px;
      backdrop-filter: blur(12px);
    }

    #hud h1 {
      margin: 0 0 0.25rem;
      font-size: 1.1rem;
      letter-spacing: 0.03em;
      color: #e0f2fe;
    }

    .bar {
      height: 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.25);
      overflow: hidden;
      margin: 0.35rem 0 0.65rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .bar > div {
      height: 100%;
      transition: width 0.18s ease;
    }

    #scene-container {
      width: 100vw;
      height: 100vh;
    }

    #controls {
      font-size: 0.9rem;
      line-height: 1.35rem;
      color: #cbd5e1;
    }

    #footer {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      background: rgba(15, 23, 42, 0.8);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      font-size: 0.9rem;
      color: #cbd5e1;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Mini 3D Arena</h1>
    <div>Seviye: <strong id="level">1</strong> • Boss: <strong id="bossHP">100</strong>%</div>
    <div class="bar"><div id="playerHP" style="width:100%; background: linear-gradient(90deg, #22d3ee, #6366f1);"></div></div>
    <div class="bar"><div id="exp" style="width:0%; background: linear-gradient(90deg, #a78bfa, #f472b6);"></div></div>
    <div id="controls">
      <strong>Kontroller:</strong><br />
      W A S D = Hareket · Fare = Kamera<br />
      <kbd>Space</kbd> = Dash · <kbd>1</kbd> = Skill (projectile)<br />
      Boss'u vurdukça exp kazanır, %100 olunca seviye atlar.
    </div>
  </div>

  <div id="footer">Node ile <code>npm start</code> veya Python ile <code>python3 -m http.server</code> başlat.</div>

  <div id="scene-container"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
